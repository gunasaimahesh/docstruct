spring:
  application:
    name: docstruct-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/docstruct}
    username: ${DB_USERNAME:docstruct}
    password: ${DB_PASSWORD:docstruct}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  # Railway (and most PaaS) inject PORT; local default stays 8080.
  port: ${PORT:8080}
  # Trust X-Forwarded-* from the platform reverse proxy so the rate limiter
  # keys on the real client. Safe on Railway/Render; for bare metal behind an
  # untrusted edge, leave this unset or override via env if needed.
  forward-headers-strategy: framework

docstruct:
  llm:
    # Any OpenAI-compatible chat-completions provider works. Examples:
    #   OpenRouter (default): base-url https://openrouter.ai/api/v1, model google/gemini-2.5-flash
    #   Google AI Studio:     base-url https://generativelanguage.googleapis.com/v1beta/openai, model gemini-2.5-flash
    api-key: ${LLM_API_KEY:${OPENROUTER_API_KEY:}}
    base-url: ${LLM_BASE_URL:https://openrouter.ai/api/v1}
    model: ${LLM_MODEL:google/gemini-2.5-flash}
    max-retries: 3
    # Cap on max_tokens per request. Lower this for Groq free tier (TPM
    # counts input + max_tokens; 4096 is safe) or if OpenRouter balance
    # is too low to reserve the full default budget.
    max-output-tokens: ${LLM_MAX_TOKENS:8192}
  extraction-cache:
    # Re-uploading identical bytes reuses the previous extraction instead of paying
    # for another LLM call. Keyed by the file's SHA-256 (plus the collection schema,
    # which is part of the prompt for follow-up documents).
    enabled: ${EXTRACTION_CACHE_ENABLED:true}
    max-entries: 500
    # Bounds how long a stale result can outlive a prompt or model change.
    ttl: 6h
  rate-limit:
    # A per-client budget on the endpoints that spend LLM calls: uploads and queries.
    # Single-instance, in-memory — sized for a single-user tool, not a fleet.
    enabled: ${RATE_LIMIT_ENABLED:true}
    capacity: ${RATE_LIMIT_CAPACITY:20}
    window: ${RATE_LIMIT_WINDOW:1m}
    max-tracked-clients: 10000
  upload:
    max-file-size-bytes: 10485760
  cors:
    # Comma-separated list of origins allowed to call the API directly
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    com.docstruct: INFO
